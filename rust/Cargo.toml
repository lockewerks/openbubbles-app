[package]
name = "whatbubbles_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
rustpush = { path = "../rustpush", features = ["macos-validation-data", "remote-anisette-v3"] }
keystore = { path = "../rustpush/keystore" }
plist = "1.5.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0.75"
thiserror = "1.0"
async-recursion = "1.0.5"
prost = "0.12"
prost-types = "0.12"
multi_log = "0.1.2"
rand = "0.8.5"
flexi_logger = "0.28.5"
log = "0.4.22"
pretty_env_logger = "0.5.0"
uuid = { version = "1.4.1", features = ["v4"] }
futures = "0.3.30"
base64 = "0.22.1"
sha2 = "0.10.8"
rasn = "0.16.0"
openssl = { version = "0.10.56", features = ["vendored"] }
aes-gcm = "0.10.3"
rusqlite = { version = "0.31", features = ["bundled"] }
directories = "5.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[build-dependencies]
prost-build = { version = "0.12" }
